# =============================================================================
# nginx - ancoreprotecaoveicular.com.br
# Site estatico (ancore_site/html_template)
#
# OBS: este projeto NAO usa PHP. O form_process.php existe no repositorio mas
# nao e processado por este nginx (bloco PHP-FPM comentado abaixo, caso seja
# reativado no futuro).
#
# Instalacao (o certificado ainda NAO existe na primeira vez, entao e preciso
# ativar este arquivo em 2 fases: primeiro so a porta 80, depois a 443):
#
#   FASE 1 - obter o certificado
#   1. Copie este arquivo para /etc/nginx/sites-available/ancoreprotecaoveicular.com.br.conf
#   2. sudo ln -s /etc/nginx/sites-available/ancoreprotecaoveicular.com.br.conf /etc/nginx/sites-enabled/
#   3. Comente TEMPORARIAMENTE o server{} da porta 443 (o bloco "HTTPS"
#      abaixo) - os arquivos de certificado ainda nao existem e o nginx
#      recusa subir apontando pra um arquivo inexistente.
#   4. sudo mkdir -p /var/www/certbot
#   5. sudo nginx -t && sudo systemctl reload nginx   (agora so a porta 80 esta ativa)
#   6. sudo certbot certonly --webroot -w /etc/nginx/sites-available/ancoreprotecaoveicular.com.br.conf -d ancoreprotecaoveicular.com.br -d www.ancoreprotecaoveicular.com.br
#      (usa "certonly": o certbot so emite o certificado, NAO edita este arquivo)
#      IMPORTANTE: copie este comando direto daqui (texto abaixo), sem colar
#      as linhas comentadas do arquivo .conf - o "#" do comentario quebra o
#      comando no meio se ele for colado com quebra de linha.
#
#   FASE 2 - ativar HTTPS
#   7. Descomente o server{} da porta 443 (os arquivos do certificado ja existem agora)
#   8. sudo nginx -t && sudo systemctl reload nginx
#   9. (opcional) configure renovacao automatica: sudo certbot renew --dry-run
#
# OBS: apenas a pasta html_template e publicada. A pasta "documentation/" do
# repositorio (docs internas do template) NAO deve ser publicada neste dominio.
# =============================================================================

# ---- limitação de taxa para o endpoint de formulário PHP (nao usado - ver bloco comentado abaixo) ----
# limit_req_zone $binary_remote_addr zone=ancore_form:10m rate=5r/m;

# -----------------------------------------------------------------------------
# HTTP (porta 80) - redireciona tudo para HTTPS, exceto o desafio ACME/certbot
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ancoreprotecaoveicular.com.br www.ancoreprotecaoveicular.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS (porta 443)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ancoreprotecaoveicular.com.br www.ancoreprotecaoveicular.com.br;

    # ---- Certificados (gerados por: certbot certonly --webroot ...) ----
    # Estes 2 arquivos só existem DEPOIS que o certbot rodar com sucesso pela
    # primeira vez. Ver instruções de ativação em 2 fases no topo do arquivo.
    ssl_certificate     /etc/letsencrypt/live/ancoreprotecaoveicular.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ancoreprotecaoveicular.com.br/privkey.pem;

    # ---- Endurecimento TLS (escrito manualmente, não depende de snippet do certbot) ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Raiz do site ----
    root /var/www/ancoreprotecaoveicular.com.br/Site_Ancore/ancore_site/html_template;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;

    access_log /var/log/nginx/ancoreprotecaoveicular.access.log;
    error_log  /var/log/nginx/ancoreprotecaoveicular.error.log;

    # ---- Cabeçalhos de segurança ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Compressão (o site usa bootstrap/aos/slick/fancybox/jquery + css/js proprios) ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/javascript
        application/json
        image/svg+xml
        font/ttf
        font/otf
        application/x-font-ttf
        application/vnd.ms-fontobject;

    # ---- Performance para arquivos grandes (videos em videos/ e images/ancore/*.mp4) ----
    sendfile on;
    tcp_nopush on;
    aio threads;
    output_buffers 2 512k;

    # Paginas de erro do proprio template
    error_page 404 /404.html;

    # ---- Bloqueia acesso a arquivos/pastas que nao devem ir para producao ----
    location ~ /\.(git|vscode|claude|editorconfig) {
        deny all;
    }
    location ~* \.(md|log)$ {
        deny all;
    }

    # ---- PHP DESATIVADO: este projeto nao usa PHP em producao. ----
    # ---- Bloco original (php/form_process.php via PHP-FPM), mantido comentado ----
    # ---- caso o formulario volte a precisar de processamento server-side.    ----
    #
    # location = /php/form_process.php {
    #     limit_req zone=ancore_form burst=3 nodelay;
    #
    #     include fastcgi_params;
    #     fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # AJUSTAR para a versao do PHP-FPM instalada
    #     fastcgi_index form_process.php;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # }

    # Qualquer .php e bloqueado (nenhum e processado neste servidor)
    location ~ \.php$ {
        deny all;
    }

    # ---- Vendor libs (bootstrap/aos/fancybox/glightbox/slick/jquery) - nao mudam com frequencia ----
    location ~* ^/(css|js)/vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---- CSS/JS proprios do site ----
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- Imagens, fontes, pdfs e videos ----
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|woff|woff2|ttf|otf|eot|pdf)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        # aceita seek/range requests no player de video
        try_files $uri =404;
    }

    # ---- HTML: sem cache agressivo, sempre revalida ----
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # ---- Rota padrao ----
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
